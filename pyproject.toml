[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ex-redteam"
version = "0.2.0"
description = "AIUC-internal, task-agnostic desk red-team pipeline for RL research tasks (CPU-only; no rollouts)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - AIUC internal"}
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5"]

[project.scripts]
redteam = "redteam.cli:main"

[tool.setuptools]
packages = ["redteam", "redteam.backends"]
include-package-data = true

[tool.setuptools.package-data]
"redteam" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "UP031"]
