# ex-redteam pipeline config. Loaded by the `redteam` CLI and merged over redteam/config.py DEFAULTS.
# Desk stages are CPU-only. Rollout stages (canary, panel) are OFF and the CLI never launches rollouts.
# Every path here is relative to the project root unless it is absolute. Nothing is hardcoded to one machine.
version: 2

# Kill lines (method/kill_thresholds.md). A task may override these in task.yaml with a reason.
kill_lines: {single_max: 0.70, best_of_4: 0.60, pass_at_4: 0.50, upper95: 0.75, tau: 0.60}

# Promotion gate (Amita, Nov 21 2026, 3:02 PM PT). Must stay "strict".
# LITERATURE-ONLY / ASSUMED attacks use the evidence-only (pre-anchoring) scores; only DEMONSTRATED-AGENT
# evidence may lower an attack. The anchored verdict is kept as an UPPER BOUND on survival, not the gate.
gate_rule: strict
anchored_upper_bound: true
pipeline:
  stop_on_strict_cut: true     # a strict CUT stops before the red team/probes (override per run with --continue-on-cut)

# Canonical pairing set (Amita, Nov 21 2026, 12:27 PM PT). Exact version pins are OPEN (bar F7).
# This is the set used for any later rollout; it does not affect the desk stages. A task may override it with a reason.
pairings:
  - {id: P1, model: "Claude Opus 5.5", harness: "Claude Code"}
  - {id: P2, model: "Gemini 4 Argon", harness: "Antigravity"}
  - {id: P3, model: "Qwen 3.8 Max", harness: "Qwen Code"}
  - {id: P4, model: "GPT-6.2 Sol", harness: "Codex"}

# Desk model backend used for the desk stages (the reviewer, NOT a pairing under test).
# backend: codex (default) runs the Codex CLI; stub is the deterministic fake used by the tests.
desk_agent:
  backend: codex
  cli: codex
  model: gpt-6.1-sol          # historical: every imported desk run used gpt-6.1-sol at effort high. Set your own model access.
  reasoning_effort: high
  web_search: true            # codex --search
  sandbox: workspace-write
  extra_args: []

# Desk exploit probes (SEPARATE run type; method/attacker_prompt.md Part C). Findings are tagged by mode and
# NEVER counted toward saturation metrics. Default: 1 white-box + 1 black-box probe per task.
probe_modes:
  blackbox: {enabled: true, count: 1}
  whitebox: {enabled: true, count: 1}

compute: {gpu: false}

# Robustness (generic form of the historical watcher.sh): stall detection + auto-resume, retries with backoff,
# per-stage timeouts.
supervisor: {stall_minutes: 15, max_resumes: 4, poll_seconds: 5, kill_grace_seconds: 10}
retries: {max_attempts: 4, backoff_initial_seconds: 30, backoff_factor: 2.0, backoff_max_seconds: 600}
stage_timeouts_minutes: {screen: 120, anchored_rescore: 150, redteam: 180, probe_blackbox: 120, probe_whitebox: 120}

# Enforced blindness: only allowed inputs are copied into an isolated, disposable per-stage workdir outside the
# repo. mode auto = use bubblewrap to additionally mask the repo/task/grader/hidden paths from the agent process
# when bwrap works, else copy-only (blindness then rests on the workdir + prompt + the post-hoc independence check).
isolation: {mode: auto, extra_hide: [], workdir_root: null, keep_workdirs: false}

checks:
  wording:      {enabled: true, enforce: true,  max_repeat_frac: 0.10, max_pair_jaccard: 0.10, max_prompt_copy_frac: 0.10, min_sentence_words: 15, shingle: 8}
  urls:         {enabled: true, enforce: false, timeout_seconds: 20, workers: 8}
  independence: {enabled: true, enforce: true}

paths: {runs_dir: runs, method_dir: method, schema: schema/task.schema.json, state_dir: .redteam_state}

# Planning cost rates (ESTIMATED). A task may override them in task.yaml.
cost_rates: {usd_per_gpu_hour: 3.0, api_usd_per_run: 100.0, basis: ESTIMATED}

# Rollout gates. Both OFF. The CLI refuses canary/panel while a gate is OFF (exit 3), still refuses if the gate is
# ON but gate_go_records lacks who/when/source (exit 3), and even then never launches a rollout (exit 4).
# Don't flip a gate yourself: Amita's GO is recorded on her side.
gates: {canary: OFF, panel: OFF, publish_or_share: OFF}
gate_go_records:
  canary: {who: "", when: "", source: ""}
  panel:  {who: "", when: "", source: ""}
