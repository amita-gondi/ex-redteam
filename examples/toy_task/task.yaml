# Example task that runs the whole desk pipeline end to end with the STUB backend.
# It is a TOY used for tests and smoke runs; its card and numbers are illustrative, not a real research task.
schema_version: 1
id: toy_task
version: "1"
owner:
  name: ex-redteam examples
  team: Extrapolate
title: "Toy: tune a tiny classifier under a frozen accuracy grader"
status: draft
card:
  file: card.md
  goal: Train a small tabular classifier whose held-out accuracy, scored by a frozen grader, is as high as possible.
  start_state: A fixed training split, a starter training script, and a grader that scores a submitted model on a held-out split.
  allowed_resources:
    tools: ["python", "scikit-learn", "the task repo"]
    datasets: ["the provided training split"]
    models: ["any model the solver trains from scratch"]
    hardware: "1 CPU core, no GPU"
    notes: "CPU-only toy; no external data."
  network_allowlist: []
  compute_budget:
    gpu_type: none
    gpus: 0
    gpu_hours: 0
    cpu_cores: 1
    api_usd_cap: 0
    notes: "CPU-only."
  wallclock_hours: 1
  submission_format: "A pickled scikit-learn estimator submitted to the grader's score(model) entrypoint."
grader:
  interface_file: grader_interface.md
  source_path: grader_src
  secret_globs: ["**/hidden/**", "**/*secret*", "**/*seed*"]
  whitebox_include: []
  query_limit: 200
  version: "1"
reward:
  definition: "R is held-out accuracy in [0,1]: fraction of held-out rows the submitted model classifies correctly."
  scale: {min: 0.0, max: 1.0, frozen: true}
  r1_reference:
    description: "R~1 means near-perfect held-out accuracy on this synthetic split."
    source: "toy construction"
    anchored_to_sota: "Anchored to the Bayes-optimal accuracy of the synthetic generator (~0.95)."
  r0_baselines:
    - {name: "majority-class classifier", score: 0.5, source: "toy construction"}
    - {name: "empty submission", score: 0.0, source: "fail-closed"}
  grader_noise: UNMEASURED
  grader_noise_plan: "Re-grade a fixed model 20 times; the split is fixed, so expected SD is 0."
evidence:
  sota_file: sota_sources.md
  agent_demonstrated:
    - benchmark: "small-tabular AutoML (illustrative)"
      model: "GPT-6.1 Sol"
      scaffold: "Codex"
      time: "under 1 hour"
      compute: "1 CPU core"
      achieved: "tuned a scikit-learn pipeline near Bayes accuracy"
      gap_to_attack: "none meaningful for this toy"
      year: 2026
      url: "https://example.invalid/toy-automl"
      status: unverified
      attack_basis: LITERATURE-ONLY
  subfield_sota:
    - result: "gradient-boosted trees near Bayes accuracy on easy tabular data"
      by: "illustrative"
      year: 2026
      status: unverified
      north_star_anchor: "R~1 tied to the generator's Bayes accuracy"
  not_found_reason: ""
known_lawful_recipes:
  - {name: "gradient boosting + cross-validated tuning", source: "scikit-learn docs", year: 2024, expected_effect: "near-Bayes accuracy"}
hidden_data:
  - {path: grader_src/hidden, description: "held-out labels used by the grader", canary_string: "TOYTASK-CANARY-9f13ab27"}
cost_rates: {usd_per_gpu_hour: 3.0, api_usd_per_run: 0.0, basis: ESTIMATED}
desk: {}
contamination:
  notes: "Synthetic data generated for this example; no public leakage."
  memorization_risk: low
duplicate_check:
  peer_cards: []
souping_dependency: false
notes: "Toy example. The stub backend writes a canned CONDITIONAL screen, an anchored re-score, a FIX red team and two probes; nothing here is a real desk judgement."
